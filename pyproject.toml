[project]
name = "safefare-fleet-python-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls the real GPS TrackTech API (opt-in: RUN_LIVE_VENDOR_TESTS=1)"]
filterwarnings = ["ignore::DeprecationWarning:fpdf.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Query() defaults

[tool.coverage.run]
source = ["app"]
